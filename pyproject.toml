[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-alpha-workbench"
version = "0.1.0"
description = "Evidence-first quantitative research and paper-portfolio workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
agents = [
  "langgraph>=0.2,<1",
  "litellm>=1.60,<2",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
  "mypy>=1.13,<2",
]

[project.scripts]
alpha-workbench = "alpha_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
ignore_missing_imports = true
